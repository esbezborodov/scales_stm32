<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <style>
      .box { fill: #f5f7fa; stroke: #37474f; stroke-width: 2; rx: 6; }
      .title { font-size: 16px; font-weight: bold; fill: #263238; }
      .sub { font-size: 12px; fill: #546e7a; }
      .pin { fill: #263238; }
      .wire { fill: none; stroke-width: 3; stroke-linecap: round; }
      .hx { stroke: #2e7d32; }
      .i2c { stroke: #1565c0; }
      .led { stroke: #ef6c00; }
      .pwr { stroke: #c62828; }
      .gnd { stroke: #37474f; }
      .note { font-size: 12px; fill: #37474f; }
    </style>
  </defs>

  <!-- MCU -->
  <rect class="box" x="340" y="40" width="220" height="440"/>
  <text class="title" x="450" y="70" text-anchor="middle">STM32F103C8T6</text>
  <text class="sub" x="450" y="88" text-anchor="middle">Blue Pill pinout, 8 MHz HSE</text>
  <g class="pin">
    <text x="352" y="155">PB12</text>
    <text x="352" y="195">PB13</text>
    <text x="352" y="255">3V3</text>
    <text x="352" y="295">GND</text>
    <text x="548" y="135" text-anchor="end">PB10 (I2C2 SCL)</text>
    <text x="548" y="175" text-anchor="end">PB11 (I2C2 SDA)</text>
    <text x="548" y="215" text-anchor="end">5V</text>
    <text x="548" y="255" text-anchor="end">GND</text>
    <text x="548" y="325" text-anchor="end">PA7</text>
    <text x="548" y="365" text-anchor="end">PA6</text>
    <text x="548" y="405" text-anchor="end">PB14</text>
    <text x="548" y="445" text-anchor="end">PB15</text>
  </g>

  <!-- HX711 -->
  <rect class="box" x="110" y="100" width="130" height="220"/>
  <text class="title" x="175" y="125" text-anchor="middle">HX711</text>
  <g class="pin">
    <text x="228" y="155" text-anchor="end">SCK</text>
    <text x="228" y="195" text-anchor="end">DT</text>
    <text x="228" y="255" text-anchor="end">VCC</text>
    <text x="228" y="295" text-anchor="end">GND</text>
    <text x="122" y="155">E+</text>
    <text x="122" y="195">E-</text>
    <text x="122" y="235">A-</text>
    <text x="122" y="275">A+</text>
  </g>
  <path class="wire hx" d="M240 150 H340"/>
  <path class="wire hx" d="M240 190 H340"/>
  <path class="wire pwr" d="M240 250 H340"/>
  <path class="wire gnd" d="M240 290 H340"/>

  <!-- Load cell -->
  <rect class="box" x="14" y="130" width="62" height="160"/>
  <text class="title" x="45" y="200" text-anchor="middle">Load</text>
  <text class="title" x="45" y="220" text-anchor="middle">cell</text>
  <text class="sub" x="45" y="310" text-anchor="middle">4-wire</text>
  <path class="wire" stroke="#c62828" d="M76 150 H110"/>
  <path class="wire" stroke="#212121" d="M76 190 H110"/>
  <path class="wire" stroke="#9e9e9e" d="M76 230 H110"/>
  <path class="wire" stroke="#2e7d32" d="M76 270 H110"/>

  <!-- LCD -->
  <rect class="box" x="640" y="60" width="230" height="220"/>
  <text class="title" x="755" y="90" text-anchor="middle">LCD1602</text>
  <text class="sub" x="755" y="108" text-anchor="middle">PCF8574 I2C backpack, 0x27</text>
  <g class="pin">
    <text x="652" y="135">SCL</text>
    <text x="652" y="175">SDA</text>
    <text x="652" y="215">VCC</text>
    <text x="652" y="255">GND</text>
  </g>
  <path class="wire i2c" d="M560 130 H640"/>
  <path class="wire i2c" d="M560 170 H640"/>
  <path class="wire pwr" d="M560 210 H640"/>
  <path class="wire gnd" d="M560 250 H640"/>

  <!-- LEDs: GPIO -> resistor -> LED -> GND -->
  <g>
    <path class="wire led" d="M560 320 H600 M640 320 H690 M712 320 H760"/>
    <path class="wire led" d="M560 360 H600 M640 360 H690 M712 360 H760"/>
    <path class="wire led" d="M560 400 H600 M640 400 H690 M712 400 H760"/>
    <path class="wire led" d="M560 440 H600 M640 440 H690 M712 440 H760"/>
    <g fill="#ffffff" stroke="#37474f" stroke-width="2">
      <rect x="600" y="313" width="40" height="14"/>
      <rect x="600" y="353" width="40" height="14"/>
      <rect x="600" y="393" width="40" height="14"/>
      <rect x="600" y="433" width="40" height="14"/>
    </g>
    <g fill="#ffb74d" stroke="#37474f" stroke-width="2">
      <path d="M690 310 L710 320 L690 330 Z"/>
      <path d="M690 350 L710 360 L690 370 Z"/>
      <path d="M690 390 L710 400 L690 410 Z"/>
      <path d="M690 430 L710 440 L690 450 Z"/>
    </g>
    <path stroke="#37474f" stroke-width="2.5" d="M711 309 V331 M711 349 V371 M711 389 V411 M711 429 V451"/>
    <text class="note" x="620" y="306" text-anchor="middle">R</text>
    <path class="wire gnd" d="M760 320 V470 M748 470 H772 M752 476 H768 M757 482 H763"/>
    <text class="note" x="775" y="474">GND</text>
    <g class="note">
      <text x="782" y="325">LED1  0.01–1.25 kg</text>
      <text x="782" y="365">LED2  1.25–2.50 kg</text>
      <text x="782" y="405">LED3  2.50–3.75 kg</text>
      <text x="782" y="445">LED4  3.75–5.00 kg</text>
    </g>
  </g>
</svg>
